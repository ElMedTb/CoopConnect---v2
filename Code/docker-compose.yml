version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: coopconnect_postgres
    restart: always
    environment:
      POSTGRES_DB: coopconnect
      POSTGRES_USER: coopconnect
      POSTGRES_PASSWORD: coopconnect123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/migrations  # For alembic

  redis:
    image: redis:7-alpine
    container_name: coopconnect_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend (will run manually first)
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  #     - redis

volumes:
  postgres_data:
  redis_data:
