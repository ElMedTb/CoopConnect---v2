spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS global — le frontend (5173) parle uniquement au gateway (8080)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ── Auth Service (Spring Boot :8081) ──────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # ── Core Service (Spring Boot :8082) ──────────────────────────────
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/v1/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # ── Swagger UI + OpenAPI (servis par le core-service) ─────────────
        - id: core-swagger
          uri: lb://core-service
          predicates:
            - Path=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html,/swagger-resources/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # ── H2 Consoles (dev) ─────────────────────────────────────────────
        - id: core-h2
          uri: lb://core-service
          predicates:
            - Path=/h2-console/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # ── Matching AI (FastAPI :8000) ───────────────────────────────────
        - id: matching-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/match/**

        # ── Matching AI docs (FastAPI Swagger) ───────────────────────────
        - id: matching-docs
          uri: http://localhost:8000
          predicates:
            - Path=/docs,/redoc,/openapi.json

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: WARN
